<div id="postPopup">
  <a id="closePopupThreadButton" class="popup-btn"
     title="close"
     /><i class="fa-regular fa-circle-xmark"></i> বন্ধ করুন </a>
<table id="postForm"><form method="post">
    <tbody>
      <tr>
	<td title="Subject">
	  বিষয়
	</td>
	<td>
	  <input name="subject" type="text" style="" id="postSubject"
		 required />
	  <input class="btn" name="submit" type="submit" value="জমা দিন"
		 title="Submit"/>
	</td>
      <tr>
	<td title="Board">
	  বোর্ড
	</td>
	<td>
	  {% include "board-selection.html" %}
	</td>
      </tr>
      <tr>
	<td title="Comment">
	  মন্তব্য
	</td>
	<td>
	  <textarea name="comment" cols="48" rows="4"
		    maxlength="4096" id="postComment" required ></textarea>
	</td>
      </tr>
    </tbody>
</form></table>
<div><a href="/static/formatting-guide.html">ফরম্যাটিং গাইড</a></div>
</div>

<script defer src="/static/popup.js"></script>
