<div id="postFormContainer">

  <form id="postForm" method="post">

    <div>

      <input name="subject" type="text" id="postSubject"
	     placeholder="বিষয়*" required />

      <input type="text" name="name" id="postName" autocomplete="name"
	     placeholder="বানন#পাসওয়ার্ড">

    </div>

    <div>

      <textarea name="comment" cols="48" rows="4" maxlength="4096"
    	      placeholder="মন্তব্য*" id="postComment" required
    	      ></textarea>

    </div>

    <div>

      <input class="btn" name="submit" type="submit" value="জমা দিন"
	   title="Submit"/>

    </div>

  </form>

</div>
