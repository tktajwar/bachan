{% extends "base.html" %}

{% block title %}
Moderate {{post.id}} | বাংলাচান
{% endblock title %}

{% block main %}

<h1 id="mod-title">
  <center>Moderate [post {{post.id}}]</center>
</h1>

<div class="thread-container">
  <div class="thread">
    <div class="thread-body">
      <a href="/{{post.board}}/{{post.id}}">
	<h3 class="thread-headline">{{post.subject}}</h3>
      </a>
      <div class="thread-comment">{{post.comment|safe}}</div>
    </div>
  </div>
</div>

<div class="mod">
  <h2><center>Moderate post</center></h2>
  <form id="modForm" action="{{post.id}}"
	method="POST">

    <label for="username">Username:</label>
    <input type="text" id="username" name="username"
	   required><br />

    <label for="passphrase">Passphrase:</label>
    <input type="password" id="passphrase" name="passphrase"
	   required><br />

    <label>Action:</label><br/>
    {% if post.is_redacted %}
    <input type="checkbox" name="restore"
	   value="restore" />
    <label for="restore">Restore & Unblock</label><br />
    {% else %}
    <input type="checkbox" name="redact"
	   value="redact" />
    <label for="redact">Redact Post</label><br />
    <input type="checkbox" name="suspend"
	   value="suspend" />
    <label for="suspend">Suspend User</label><br />
    {% endif %}

    <label for="reason">Reason:</label>
    <textarea id="reason" name="reason" minlength="20"
	      maxlength="256" required ></textarea> <br />

    <button type="submit">Submit</button>

  </form>
</div>

{% endblock main %}
