<p class="thread-tagline">

  {% if thread.is_saged %}
  <span class="thread-saged">
    [SAGED]
  </span>
  {% endif %}

  <span class="thread-headline">
    <a href="/k/{{thread.id}}">
      {% if thread.is_redacted %}
      #সম্পাদিত#
      {% else %}
      {{thread.subject}}
      {% endif %}
    </a>
  </span>

  <br class="md-only-block" />

  <span class="thread-utid">
    {{thread.user_name}}{% if thread.user_code %}#{{thread.user_code}}{% endif %} <span class="cc">{{thread.user_country}}</span>
  </span>

  <br class="sm-only-block" />

  <span class="thread-time">
    {{thread.birth_time}}
  </span>

  <span class="thread-id">
    <a href="/{{thread.board}}/{{thread.id}}?enref={{thread.id}}"
       onclick="return enref('{{thread.id}}')"
       title="(cite) পোস্টটি উদ্ধৃত করুন">
      [ প্রকাশনা {{thread.id}} ]
    </a>
  </span>

  <span class="thread-replies">
    <a href="/{{thread.board}}/{{thread.id}}#replies" title="(replies) 0 টি মন্তব্য">
      <span class="la--comments"></span> {{thread.reply_count}}
    </a>
  </span>

  <span class="thread-report">
    <a href="/{{thread.board}}/moderation/{{thread.id}}"
       title="(report) রিপোর্ট করুন">
      <span class="reicon--flag"></span>
    </a>
  </span>

  <br class="sm-only-block" />

  <span id="bl_{{thread.id}}" class="backlink">
  </span>

</p>
