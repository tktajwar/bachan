<p class="thread-tagline">
  <span class="thread-board">
    <a href="/{{thread.board}}/">/{{thread.board}}/</a>
  </span>
  <span class="thread-utid">
    {{thread.uname}}#{{thread.utid}} [{{thread.country}}]
  </span>
  <span class="thread-time">
    {{thread.ctime}}
  </span>
  <span class="thread-id">
    প্রকাশনা {{thread.id}}
  </span>
</p>
