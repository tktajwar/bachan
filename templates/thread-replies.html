<div id="thread-replies">
  <span id="replies" style="display:none;"> </span>
  {% for reply in replies %}
  <div class="reply" id="{{reply.id}}">
    {% include "reply-tagline.html" %}
    <div class="reply-body">
      <div class="reply-comment">
	{% if reply.is_redacted %}
	~~###সম্পাদিত###~~
	{% else %}
	{{reply.comment}}
	{% endif %}
      </div>
    </div>
  </div>
  {% endfor %}
</div>
