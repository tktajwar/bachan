{% if thread.replies %}
<div class="board-thread-replies" id="{{thread.id}}">
  {% if thread.reply_count > 5 %}
  <div class="load-more-replies">
    <a href="/k/{{thread.id}}" title="load all replies">
      সকল মন্তব্য দেখুন ({{thread.reply_count - 5}} omitted)
    </a>
  </div>
  {% endif %}

  {% for reply in thread.replies %}
  <div class="reply" id="{{reply.id}}">
    {% include "reply-tagline.html" %}
    <div class="reply-body">
      <div class="reply-comment">{{reply.comment}}</div>
    </div>
  </div>
  {% endfor %}

</div>
{% endif %}
