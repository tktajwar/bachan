<script>
  const initialInterval = 10;
  const maxInterval = 1200;
  let lastMtime = {{last_mtime}};
  let unseenCount = 0;
  let interval = initialInterval;
  let originalTitle = document.title;

  async function fetchUpdates() {
      const res = await fetch(`/updates?after_mtime=${lastMtime}`);
      if(!res.ok) return;
      const data = await res.json();
      if (Array.isArray(data[0]) && data[0].length) {
	  insertThreads(data[0]);
	  unseenCount += data[0].length;
	  updateTitle();
	  interval = initialInterval;
      } else {
	  interval = Math.min(interval * 2, maxInterval);
      }
      lastMtime = data[1];
      setTimeout(fetchUpdates, interval*1000);
  }

  function insertThreads(threads){
      const container = document.getElementById('highlights-container');
      if (!container) return;
      const frag = document.createDocumentFragment();
      threads.forEach(p => {
	  const older = document.getElementById(`${p.id}`);
	  if (older) older.remove();
	  const div = document.createElement('div');
	  div.className = 'thread';
	  div.dataset.postId = String(p.id);
	  div.id = `${p.id}`;
	  div.innerHTML = `
<h3 class="boardLabel"><a href="/${p.board}/" title="/${p.board}/">
<center>${p.label}</center>
</a></h3>
<div class="thread-body">
  <a href="/k/${p.id}">
    <h4 class="thread-headline">${p.subject}</h4>
  </a>
  <div class="thread-comment">${p.comment}</div>
</div>
<ul class="thread-buttons">
  <li class="thread-replies">
    <a href="/k/${p.id}#replies" title="(replies) 0 টি মন্তব্য">
      <i class="fa-regular fa-comment"></i> ${p.reply_count}
    </a>
    <span class="thread-mtime" title="${p.mtime}"><span>
  </li>
  <li class="thread-report">
    <!-- TODO -->
    <a href="#" title="(report) রিপোর্ট করুন">
      <i class="fa-regular fa-flag"></i>
    </a>
  </li>
  <li class="thread-mod">
    <a href="/mod/${p.id}" title="(moderate) পরিচালনা করুন">
      <i class="fa-solid fa-ellipsis"></i>
    </a>
  </li>
</ul>
`;
	  frag.appendChild(div);
      });
      container.prepend(frag);
  }

  fetchUpdates();

  function inLocalTime(s) {
    const options = { 
	year: 'numeric', 
	month: 'long', 
	day: 'numeric', 
	hour: '2-digit', 
	minute: '2-digit', 
	hour12: false,
    };

      const utcDate = new Date(s.trim());
      return utcDate.toLocaleString('bn-BD',options);
  }

  function updateTitle() {
      if (unseenCount > 0) {
	  document.title = `(${unseenCount}) ${originalTitle}`;
      }
  }

  function clearUnseen() {
      unseenCount = 0;
      document.title = `${originalTitle}`;
  }

  window.addEventListener('focus', clearUnseen);

</script>
