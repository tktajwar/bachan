<div id="replyFormContainer">

  <form method="post" id="replyForm">

    <div class="actions">

      <input type="text" id="postName" name="name"
	     placeholder=" বানন#পাসওয়ার্ড">

      <button type="submit">জমা দিন</button>

    </div>

    <div>

      <textarea name="comment" cols="48" rows="4" maxlength="2048"
	      id="postComment" placeholder="আপনার মন্তব্য*"
	      required></textarea><br/>

    </div>

</div>
