<div id="thread-reply-form">

  <h3 id="reply-form"> আপনার মন্তব্য* </h3>

  <form method="post">

    <center>

      <textarea name="comment" cols="48" rows="4" maxlength="2048"
	      id="postComment" required></textarea><br/>

      <label for="name">নাম:</label>

      <input type="text" id="postName" name="name"
	     placeholder=" বানন#পাসওয়ার্ড">

      <input class="btn" name="submit" type="submit" value="জমা দিন"
      title="Submit"/>

    </center>

  </form>


</div>
