{% extends "base.html" %}

{% block title %}
Create Moderator Token - বাchan
{% endblock title %}

{% block main %}

<h1 id="mod-title">
  <center>Create Moderator Token</center>
</h1>
<div class="mod">
  <h2>Create Token</h2>
  <form id="token-form" action="/token" method="POST">

    <label for="server_pin">Server Pin:</label>
    <input type="password" id="server_pin" name="server_pin"
	   required><br />
    <label for="server_passphrase">Server Passphrase:</label>
    <input type="password" id="server_passphrase" name="server_passphrase"
	   required><br />
    <br />
    <label for="toke_passphrase">Token Passphrase:</label>
    <input type="password" id="token_passphrase" name="token_passphrase"
	   required><br />

    <button type="submit">Submit</button>

  </form>
</div>

{% endblock main %}
