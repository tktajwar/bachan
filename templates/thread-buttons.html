<ul class="thread-buttons">

  <li class="thread-reply">
    <a href="/{{thread.board}}/{{thread.id}}?enref={{thread.id}}"
       onclick="return enref('{{thread.id}}')"
       title="(cite) পোস্টটি উদ্ধৃত করুন">
      <span class="reicon--angles-right-filled"></span>{{thread.id}}
    </a>
  </li>

  <li class="thread-replies">
    <a href="/k/{{thread.id}}#replies" title="(replies) 0 টি মন্তব্য">
      <span class="la--comments"></span> {{thread.reply_count}}
    </a>
  </li>

  <li class="thread-report">
    <a href="#" title="(report) রিপোর্ট করুন">
      <span class="reicon--flag"></span>
    </a>
  </li>

</ul>
