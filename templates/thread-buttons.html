<ul class="thread-buttons">
  <li class="thread-reply">
    <a href="/k/{{thread.id}}?enref={{thread.id}}"
       onclick="
		if (typeof window['add_ref']=='function') {
		window['add_ref']('{{thread.id}}');
		return false;
		} else {
		return true;
		}
		"
       title="(cite) পোস্টটি উদ্ধৃত করুন">
      <i class="fa-solid fa-angles-right"></i>{{thread.id}}
    </a>
  </li>
  <li class="thread-replies">
    <a href="/k/{{thread.id}}#replies" title="(replies) 0 টি মন্তব্য">
      <i class="fa-regular fa-comment"></i> {{thread.reply_count}}
    </a>
  </li>
  <li class="thread-report">
    <!-- TODO -->
    <a href="#" title="(report) রিপোর্ট করুন">
      <i class="fa-regular fa-flag"></i>
    </a>
  </li>
  <li class="thread-mod">
    <a href="/mod/{{thread.id}}" title="(moderate) পরিচালনা করুন">
      <i class="fa-solid fa-ellipsis"></i>
    </a>
  </li>
</ul>
