<div class="thread" id="{{thread.id}}">
  <h3 class="boardLabel"><a href="/{{thread.board}}/" title="/{{thread.board}}/">
      <center>{{thread.label}}</center>
  </a></h3>
  <div class="thread-body">
    <a href="/k/{{thread.id}}">
      <h4 class="thread-headline">{{thread.subject}}</h4>
    </a>
    <div class="thread-comment">{{thread.comment|safe}}</div>
  </div>
  {% include "thread-buttons.html" %}
</div>
