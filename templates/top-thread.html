<div class="thread" id="{{thread.id}}">
  <h3 class="boardLabel"><a href="/{{thread.board}}/" title="/{{thread.board}}/">
      <center>{{thread.label}}</center>
  </a></h3>
  <div class="thread-body">
    <a href="/{{thread.board}}/{{thread.id}}">
      <h4 class="thread-headline" style="text-align:center;">{{thread.subject}}</h4>
    </a>
    <div class="thread-comment">{{thread.comment}}</div>
  </div>
</div>
